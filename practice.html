<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-root="." data-page="practice-home" data-mode="practice">
  <div id="site-header"></div>
  <div class="wrap">
    <section class="hero hero-practice">
      <span class="kicker">國中八年級　理化　學生練習</span>
      <h1>練習專區</h1>
      <p>這裡只有段考前練習與章末評量，不含講義正文。適合回家複習、段考前自測。</p>
      <svg class="wave-deco" viewBox="0 0 280 90" aria-hidden="true">
        <rect x="36" y="28" width="48" height="40" rx="8" fill="none" stroke="#fff" stroke-width="5"/>
        <rect x="116" y="28" width="48" height="40" rx="8" fill="none" stroke="#fff" stroke-width="5"/>
        <rect x="196" y="28" width="48" height="40" rx="8" fill="none" stroke="#fff" stroke-width="5"/>
        <path d="M60 48 h20 M140 48 h20 M220 48 h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </section>

    <article class="card">
      <div class="section-head">
        <div class="badge calc">練</div>
        <div>
          <h2>怎麼用？</h2>
          <p>先選章 → 再選小節練習或章末評量</p>
        </div>
      </div>
      <ul class="q">
        <li>每小節有「段考前練習」（四選一）。</li>
        <li>章末有「全章複習評量」（抽題）。</li>
      </ul>
    </article>

    <div class="section-cards" id="practice-chapter-cards"></div>

    <p class="footer">
      國中八年級理化　練習專區<br>
    </p>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/site-mode.js"></script>
  <script src="js/config-practice.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
