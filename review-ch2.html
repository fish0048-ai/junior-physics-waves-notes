<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#fffefb">
  <title>國中八年級理化｜第 2 章複習評量</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="." data-page="review" data-section="ch-2" data-pick="40">
  <div id="site-header"></div>
  <div class="wrap workbook exam-sheet" id="top">
    <section class="hero">
      <span class="kicker">國中八年級　理化講義</span>
      <h1>第 2 章　複習評量</h1>
      <svg class="wave-deco" viewBox="0 0 280 90" aria-hidden="true">
        <rect x="28" y="42" width="44" height="36" rx="4" fill="none" stroke="#fff" stroke-width="5"/>
        <path d="M36 42 V 30 H 64 V 42" fill="none" stroke="#fff" stroke-width="5"/>
        <ellipse cx="140" cy="58" rx="28" ry="22" fill="none" stroke="#fff" stroke-width="5"/>
        <path d="M200 70 C 208 40 232 40 240 70 Z" fill="none" stroke="#fff" stroke-width="5"/>
      </svg>
    </section>
    <article class="card" id="exam">
      <div class="section-head">
        <div class="badge calc">評</div>
        <div>
          <h2>章末複習評量</h2>
          <p>涵蓋 2-1～2-3　｜　題庫 120 題抽 40 題　｜　本次 <span id="exam-count">0</span> 題</p>
        </div>
      </div>
      <p class="exam-lead">題庫共 120 題，每次抽出 40 題（涵蓋認識物質、水溶液與空氣組成）。可先選班級，按「存成此班題本」記住這一組；之後同一班會載入同一套題。也可按「換一套題」再抽。</p>
      <div class="exam-toolbar no-print">
        <button class="btn btn-green" type="button" id="exam-check">檢查作答</button>
        <button class="btn btn-ghost" type="button" id="exam-key">顯示詳解</button>
        <button class="btn btn-ghost" type="button" id="exam-reset">重設</button>
        <button class="btn btn-ghost" type="button" id="exam-reshuffle">換一套題</button>
        <span class="exam-score" id="exam-score"></span>
      </div>
      <div id="exam-list"></div>
    </article>
    <p class="footer">
      第 2 章　物質的世界　章末評量<br>
      原始碼：<a data-github target="_blank" rel="noopener">GitHub 專案</a>
    </p>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/config-ch2.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/exam-ch2-sections.js"></script>
  <script src="js/exam-ch2.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>
