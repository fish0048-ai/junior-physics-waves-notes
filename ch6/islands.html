<!DOCTYPE html>
<html lang="zh-Hant" class="islands-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8dce8">
  <title>國中八年級理化｜第 6 章 理化探索群島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/ch6-islands.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="islands-app" class="islands-app">
    <header class="islands-topbar">
      <a id="islands-btn-back" href="../ch6.html">← 第 6 章目錄</a>
      <h1>理化探索群島</h1>
      <button type="button" id="islands-btn-reset-view">重設視角</button>
    </header>
    <div class="islands-stage">
      <canvas id="islands-canvas" aria-label="3D 六角群島場景，點選島嶼開始探索"></canvas>
      <p class="islands-hint">拖曳旋轉 · 滾輪或雙指縮放 · 點選島嶼 · 重設視角回全景</p>
      <div id="islands-fallback" hidden></div>

      <aside id="islands-panel" class="islands-panel" hidden aria-live="polite">
        <h2 id="islands-panel-title">島嶼</h2>
        <div id="islands-panel-body"></div>
        <div class="islands-panel-actions">
          <button type="button" id="islands-btn-explore" class="is-primary">開始探索</button>
          <a id="islands-btn-lecture" href="../sections/6-3.html" class="islands-topbar">閱讀講義</a>
          <button type="button" id="islands-btn-close">關閉</button>
        </div>
      </aside>

      <section id="islands-lab" class="islands-lab" hidden aria-labelledby="atom-lab-title">
        <div class="islands-lab-head">
          <div>
            <h2 id="atom-lab-title">原子研究所 · 互動任務</h2>
            <p>先預測：中性碳原子需要幾個質子、電子、中子？再操作模型驗證（對照 6-3 講義）。</p>
          </div>
          <button type="button" id="atom-lab-close">返回群島</button>
        </div>
        <div class="atom-controls">
          <div class="atom-part">
            <strong>質子</strong>
            <button type="button" data-part="p" data-delta="-1" aria-label="減少質子">−</button>
            <button type="button" data-part="p" data-delta="1" aria-label="增加質子">＋</button>
          </div>
          <div class="atom-part">
            <strong>中子</strong>
            <button type="button" data-part="n" data-delta="-1" aria-label="減少中子">−</button>
            <button type="button" data-part="n" data-delta="1" aria-label="增加中子">＋</button>
          </div>
          <div class="atom-part">
            <strong>電子</strong>
            <button type="button" data-part="e" data-delta="-1" aria-label="減少電子">−</button>
            <button type="button" data-part="e" data-delta="1" aria-label="增加電子">＋</button>
          </div>
        </div>
        <canvas id="atom-mini-canvas" width="280" height="180" aria-hidden="true"></canvas>
        <div id="atom-readout"></div>
        <p id="atom-feedback"></p>
        <button type="button" id="atom-btn-check" class="is-primary" style="margin-top:8px;padding:8px 14px;border-radius:999px;border:1px solid #1d4ed8;">檢查：是否為中性碳-12？</button>
      </section>
    </div>
  </div>
  <script type="module" src="../js/ch6-islands/main.js"></script>
</body>
</html>
