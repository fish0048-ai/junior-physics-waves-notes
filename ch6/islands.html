<!DOCTYPE html>
<html lang="zh-Hant" class="islands-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8fdde4">
  <title>國中八年級理化｜第 6 章 理化探索群島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/ch6-islands.css?v=10">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="islands-app" class="islands-app">
    <canvas id="islands-canvas" tabindex="0" aria-label="3D 六角群島場景。拖曳旋轉、滾輪或雙指縮放，點島嶼開始探索；數字鍵 1 到 6 可直接選島。"></canvas>
    <div id="islands-fallback" class="isl-fallback" hidden></div>

    <header class="hud-top">
      <div class="hud-brand">
        <a id="islands-btn-back" class="hud-back" href="../ch6.html" aria-label="返回第 6 章目錄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
        <div class="hud-brand-text">
          <h1>理化探索群島</h1>
          <small>第 6 章　探索物質組成</small>
        </div>
      </div>
      <div class="hud-actions">
        <div id="islands-progress" class="hud-stars" role="status" aria-live="polite"></div>
        <button type="button" id="islands-btn-reset-view" class="hud-btn" aria-label="回到全景"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span class="lbl">全景</span></button>
        <button type="button" id="islands-btn-mistakes" class="hud-btn" aria-label="錯題本"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M4 7h4M4 12h4M4 17h4M11 8h5M11 12h5"/></svg><span class="lbl">錯題本</span><span id="islands-mistake-count" class="hud-badge" hidden>0</span></button>
        <button type="button" id="islands-btn-profile" class="hud-btn" aria-label="學習檔案"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg><span class="lbl">學習檔案</span></button>
        <button type="button" id="islands-btn-sound" class="hud-btn" aria-pressed="false" aria-label="音效開關"></button>
        <button type="button" id="islands-btn-help" class="hud-btn" aria-label="操作說明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg><span class="lbl">說明</span></button>
      </div>
    </header>

    <p id="islands-hint" class="islands-hint">拖曳旋轉　滾輪或雙指縮放　點島嶼開始</p>
    <nav id="islands-dock" class="hud-dock" aria-label="六座島嶼"></nav>
    <aside id="islands-panel" class="isl-panel" hidden aria-labelledby="islands-panel-title"></aside>

    <section id="islands-lab" class="islands-lab" hidden role="dialog" aria-modal="true" aria-labelledby="islands-lab-title">
      <div class="islands-lab-card">
        <div class="islands-lab-head">
          <span id="islands-lab-icon" class="islands-lab-icon" aria-hidden="true"></span>
          <div class="islands-lab-titles">
            <h2 id="islands-lab-title">互動任務</h2>
            <p id="islands-lab-lead"></p>
          </div>
          <button type="button" id="islands-lab-close" class="islands-lab-close">返回群島</button>
        </div>
        <div id="islands-lab-content"></div>
      </div>
    </section>

    <div id="islands-toast" class="isl-toast" role="status" aria-live="polite"></div>
    <div id="islands-tutorial" class="isl-modal" hidden role="dialog" aria-modal="true" aria-labelledby="isl-tut-title"></div>
    <div id="islands-finale" class="isl-modal" hidden role="dialog" aria-modal="true" aria-labelledby="isl-finale-title"></div>
    <div id="islands-mistakes" class="isl-modal" hidden role="dialog" aria-modal="true" aria-labelledby="isl-mistakes-title"></div>
    <div id="islands-profile" class="isl-modal" hidden role="dialog" aria-modal="true" aria-labelledby="isl-profile-title"></div>

    <div id="islands-loading" class="isl-loading">
      <div class="isl-loading-inner">
        <svg class="isl-loading-logo" viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="#ffffff" opacity=".22"/>
          <polygon points="50,16 79,33 79,67 50,84 21,67 21,33" fill="#ffffff"/>
          <text x="50" y="62" text-anchor="middle" font-size="34" font-weight="900" fill="#ff7043">6</text>
        </svg>
        <p class="isl-loading-title">理化探索群島</p>
        <p id="islands-loading-text" class="isl-loading-text">正在組裝群島…</p>
        <div class="isl-loading-bar"><span id="islands-loading-bar"></span></div>
      </div>
    </div>
  </div>
  <noscript><p style="padding:24px;font-size:18px">需要開啟 JavaScript 才能使用群島。請改看 <a href="../ch6.html">第 6 章講義</a>。</p></noscript>
  <script type="module" src="../js/ch6-islands/main.js?v=10"></script>
  <script>
    setTimeout(function () {
      var el = document.getElementById("islands-loading");
      var text = document.getElementById("islands-loading-text");
      if (el && text && !el.classList.contains("is-done")) {
        text.innerHTML = '載入比較慢，請稍候；或先回 <a href="../ch6.html" style="color:#fff">第 6 章講義</a>。';
      }
    }, 15000);
  </script>
</body>
</html>
