<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#fffefb">
  <title>國中八年級理化｜第 1 章複習評量</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="." data-page="review" data-section="ch-1" data-pick="40">
  <div id="site-header"></div>
  <div class="wrap workbook exam-sheet" id="top">
    <section class="hero">
      <span class="kicker">國中八年級　理化講義</span>
      <h1>第 1 章　複習評量</h1>
      <svg class="wave-deco" viewBox="0 0 280 90" aria-hidden="true">
        <rect x="24" y="38" width="232" height="22" rx="4" fill="none" stroke="#fff" stroke-width="5"/>
        <path d="M48 38 V 50 M 72 38 V 54 M 96 38 V 50 M 120 38 V 54 M 144 38 V 50 M 168 38 V 54 M 192 38 V 50 M 216 38 V 54 M 240 38 V 50" stroke="#fff" stroke-width="3"/>
      </svg>
    </section>
    <article class="card" id="exam">
      <div class="section-head">
        <div class="badge calc">評</div>
        <div>
          <h2>章末複習評量</h2>
          <p>涵蓋 1-0～1-2　｜　題庫 120 題抽 40 題　｜　本次 <span id="exam-count">0</span> 題</p>
        </div>
      </div>
      <p class="exam-lead">題庫共 120 題，每次從中抽出 40 題（涵蓋安全與器材、長度體積、質量密度）。可先選班級，按「存成此班題本」記住這一組；之後同一班會載入同一套題。也可按「換一套題」再抽。</p>
      <div class="exam-toolbar no-print">
        <button class="btn btn-green" type="button" id="exam-check">檢查作答</button>
        <button class="btn btn-ghost" type="button" id="exam-key">顯示詳解</button>
        <button class="btn btn-ghost" type="button" id="exam-reset">重設</button>
        <button class="btn btn-ghost" type="button" id="exam-reshuffle">換一套題</button>
        <span class="exam-score" id="exam-score"></span>
      </div>
      <div id="exam-list"></div>
    </article>
    <p class="footer">
      第 1 章　基本測量　章末評量<br>
      原始碼：<a href="https://github.com/fish0048-ai/junior-physics-waves-notes" target="_blank" rel="noopener">GitHub 專案</a>
    </p>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/config-ch1.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/exam-ch1-sections.js"></script>
  <script src="js/exam-ch1.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>
