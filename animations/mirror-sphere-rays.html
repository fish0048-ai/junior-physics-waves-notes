<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>凸面鏡、凹面鏡光路作圖</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fa; color: #193247; font: 16px/1.65 system-ui, "Microsoft JhengHei", sans-serif; }
    main { max-width: 1050px; margin: auto; padding: 24px; }
    small { color: #547082; }
    h1 { font-size: clamp(23px, 4vw, 31px); line-height: 1.4; margin: 6px 0 8px; }
    p { margin: 8px 0 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0; align-items: center; }
    .control { flex: 1 1 200px; max-width: 360px; }
    .control label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
    .control output { font-variant-numeric: tabular-nums; font-weight: 600; }
    input[type=range] { width: 100%; min-height: 44px; accent-color: #087fa4; }
    select { font: inherit; min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1px solid #afc4d0; }
    button {
      font: inherit; min-height: 44px; padding: 8px 14px;
      border: 1px solid #afc4d0; border-radius: 8px; color: #193247; background: white; cursor: pointer;
    }
    button.primary { background: #076b87; color: white; border-color: #076b87; }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
    .visual { background: white; border: 1px solid #dbe7ed; border-radius: 16px; overflow: hidden; }
    svg#scene { display: block; width: 100%; height: 420px; touch-action: none; }
    svg text { font: 14px system-ui, "Microsoft JhengHei", sans-serif; fill: #29495e; }
    .readout { padding: 14px 18px; background: #edf5f8; min-height: 56px; font-size: 15px; line-height: 1.55; }
    .readout strong { color: #0e7490; }
    .legend { font-size: 14px; margin: 8px 0 12px; }
    .key { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #e6f1f5; margin: 2px; }
    .toggles { display: flex; flex-wrap: wrap; gap: 12px; font-size: 15px; }
    .toggles label { display: flex; align-items: center; gap: 6px; min-height: 44px; }
    @media (max-width: 480px) { main { padding: 14px; } svg#scene { height: 380px; } }
  </style>
  <link rel="stylesheet" href="embed.css">
</head>
<body>
<script>if (window.parent !== window) document.documentElement.classList.add("is-embed");</script>
<main>
  <small>國中理化 · 4-2 曲面鏡</small>
  <h1>凸面鏡、凹面鏡光路作圖</h1>
  <p>調整物距，觀察<strong>兩條典型光線</strong>（平行主軸、過焦點）與成像。凸面鏡反射光用<strong>延長線</strong>；凹面鏡在焦點外為<strong>實際交會</strong>的實像。</p>
  <p class="legend">
    <span class="key" style="background:#dbeafe;color:#1d4ed8">入射光</span>
    <span class="key" style="background:#fecaca;color:#b91c1c">反射光</span>
    <span class="key" style="background:#e2e8f0;color:#475569">延長線（虛像）</span>
    <span class="key" style="background:#bbf7d0;color:#166534">像</span>
  </p>
  <div class="controls">
    <label>鏡面
      <select id="mirror-type">
        <option value="concave">凹面鏡</option>
        <option value="convex">凸面鏡</option>
      </select>
    </label>
    <div class="control">
      <label for="obj-u">物距（物到鏡心 V）<output id="obj-u-out"></output></label>
      <input id="obj-u" type="range" min="8" max="95" step="1" value="35">
    </div>
  </div>
  <div class="presets">
    <button type="button" class="primary" id="preset-far">物在 2F 外（凹面：縮小實像）</button>
    <button type="button" id="preset-between">物在 F～2F（凹面：放大實像）</button>
    <button type="button" id="preset-inside">物在 F 內（凹面：放大虛像）</button>
    <button type="button" id="preset-convex">凸面鏡（永遠虛像）</button>
  </div>
  <div class="toggles">
    <label><input type="checkbox" id="show-rays" checked> 顯示光線</label>
    <label><input type="checkbox" id="show-image" checked> 標示像</label>
    <label><input type="checkbox" id="show-labels" checked> 標示 F、C、V</label>
  </div>
  <div class="visual">
    <svg id="scene" viewBox="0 0 820 480" aria-label="球面鏡光路圖">
      <defs>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#cbd5e1" stroke-width="1"/>
        </pattern>
        <marker id="arr-in" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 1 L8 5 L0 9 z" fill="#2563eb"/>
        </marker>
        <marker id="arr-out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 1 L8 5 L0 9 z" fill="#dc2626"/>
        </marker>
      </defs>
      <g id="layer"></g>
    </svg>
    <div class="readout" id="readout" aria-live="polite"></div>
  </div>
</main>
<script src="embed-resize.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const layer = $("layer");
  const VX = 520;
  const VY = 240;
  const R = 108;
  const F = R / 2;
  const OBJ_H = 52;

  const state = {
    type: "concave",
    u: 35,
    showRays: true,
    showImage: true,
    showLabels: true
  };

  function syncTypeFromUrl() {
    const p = new URLSearchParams(location.search);
    const t = p.get("type");
    if (t === "convex" || t === "concave") {
      state.type = t;
      $("mirror-type").value = t;
    }
  }

  function center() {
    return state.type === "concave"
      ? { x: VX - R, y: VY }
      : { x: VX + R, y: VY };
  }

  function focus() {
    return state.type === "concave"
      ? { x: VX - F, y: VY }
      : { x: VX + F, y: VY };
  }

  function norm(v) {
    const l = Math.hypot(v.x, v.y) || 1;
    return { x: v.x / l, y: v.y / l };
  }

  function dot(a, b) { return a.x * b.x + a.y * b.y; }

  function reflect(i, n) {
    const d = dot(i, n);
    return norm({ x: i.x - 2 * d * n.x, y: i.y - 2 * d * n.y });
  }

  function normalAt(M) {
    const C = center();
    return norm({ x: M.x - C.x, y: M.y - C.y });
  }

  /** 主軸上方物頂 y */
  function objectTop(uCm) {
    const scale = 4.2;
    const ox = VX - uCm * scale;
    return { x: ox, y: VY - OBJ_H, u: uCm, foot: { x: ox, y: VY } };
  }

  /** 水平線 y 與鏡弧交點 */
  function mirrorAtY(y) {
    const C = center();
    const dy = y - C.y;
    if (Math.abs(dy) > R) return null;
    const dx = Math.sqrt(R * R - dy * dy);
    const M = state.type === "concave"
      ? { x: C.x + dx, y }
      : { x: C.x - dx, y };
    if (M.x > 60 && M.x < VX + 8) return M;
    return null;
  }

  /** 線段 P + t*v 與圓弧（鏡面）交點，t>0 */
  function lineMirrorHit(P, v) {
    const C = center();
    const ox = P.x - C.x;
    const oy = P.y - C.y;
    const a = v.x * v.x + v.y * v.y;
    const b = 2 * (ox * v.x + oy * v.y);
    const c = ox * ox + oy * oy - R * R;
    const disc = b * b - 4 * a * c;
    if (disc < 0) return null;
    const s = Math.sqrt(disc);
    let t1 = (-b + s) / (2 * a);
    let t2 = (-b - s) / (2 * a);
    const hits = [t1, t2].filter((t) => t > 0.001).sort((a, b) => a - b);
    for (const t of hits) {
      const M = { x: P.x + v.x * t, y: P.y + v.y * t };
      if (Math.abs(M.y - VY) > R + 2) continue;
      if (state.type === "concave" && M.x >= VX - 6 && M.x <= VX + 4) return M;
      if (state.type === "convex" && M.x <= VX + 6 && M.x >= VX - R - 8) return M;
    }
    return null;
  }

  function intersectLines(P1, v1, P2, v2) {
    const cross = v1.x * v2.y - v1.y * v2.x;
    if (Math.abs(cross) < 1e-6) return null;
    const dx = P2.x - P1.x;
    const dy = P2.y - P1.y;
    const t = (dx * v2.y - dy * v2.x) / cross;
    return { x: P1.x + v1.x * t, y: P1.y + v1.y * t, t };
  }

  function trace() {
    const P = objectTop(state.u);
    const Fp = focus();
    const M1 = mirrorAtY(P.y);
    if (!M1) return { error: "物高超出鏡面範圍，請調整物距。" };

    const i1 = norm({ x: M1.x - P.x, y: M1.y - P.y });
    const r1 = reflect(i1, normalAt(M1));

    const v2 = norm({ x: Fp.x - P.x, y: Fp.y - P.y });
    const M2 = lineMirrorHit(P, v2);
    if (!M2) return { error: "第二條光線未打到鏡面，請調整物距。" };
    const i2 = norm({ x: M2.x - P.x, y: M2.y - P.y });
    const r2 = reflect(i2, normalAt(M2));

    const hit = intersectLines(M1, r1, M2, r2);
    const fVal = F / 4.2;
    let virtual = state.type === "convex" || state.u < fVal;
    let imageArrow = null;

    if (hit && hit.t > 0 && !virtual) {
      const imgTopY = VY - (VY - P.y) * (hit.x - VX) / (P.x - VX);
      imageArrow = {
        top: { x: hit.x, y: imgTopY },
        foot: { x: hit.x, y: VY },
        virtual: false
      };
    } else {
      virtual = true;
      const back1 = { x: -r1.x, y: -r1.y };
      const back2 = { x: -r2.x, y: -r2.y };
      const vHit = intersectLines(M1, back1, M2, back2);
      if (vHit) {
        const imgTopY = VY - (VY - P.y) * 0.75;
        imageArrow = {
          top: { x: vHit.x, y: imgTopY },
          foot: { x: vHit.x, y: VY },
          virtual: true
        };
      }
    }

    return { P, M1, r1, M2, r2, Fp, image: imageArrow, virtual, C: center() };
  }

  function describe(u, virtual, type) {
    if (type === "convex") {
      return `物距約 ${u} cm：<strong>正立、縮小、虛像</strong>（反射光延長線交於鏡後）。`;
    }
    const fVal = F / 4.2;
    if (u < fVal) {
      return `物距 ${u} cm（< f）：<strong>正立、放大、虛像</strong>。`;
    }
    if (u < 2 * fVal) {
      return `物距 ${u} cm（f～2f）：<strong>倒立、放大、實像</strong>。`;
    }
    return `物距 ${u} cm（> 2f）：<strong>倒立、縮小、實像</strong>。`;
  }

  function el(name, attrs) {
    const n = document.createElementNS("http://www.w3.org/2000/svg", name);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === "text") n.textContent = v;
      else if (v != null && v !== "") n.setAttribute(k, v);
    });
    return n;
  }

  function draw() {
    layer.replaceChildren();
    const C = center();
    const Fp = focus();
    const backPath = state.type === "concave"
      ? `M ${VX - 2} ${VY - R} A ${R} ${R} 0 0 1 ${VX - 2} ${VY + R} L ${VX + 70} ${VY + R} L ${VX + 70} ${VY - R} Z`
      : `M ${VX + 2} ${VY - R} A ${R} ${R} 0 0 0 ${VX + 2} ${VY + R} L ${VX - 70} ${VY + R} L ${VX - 70} ${VY - R} Z`;

    layer.appendChild(el("rect", { x: 0, y: 0, width: 820, height: 480, fill: "#f8fafc" }));
    layer.appendChild(el("line", {
      x1: 40, y1: VY, x2: 780, y2: VY, stroke: "#334155", "stroke-width": 1.6
    }));
    layer.appendChild(el("path", { d: backPath, fill: "url(#hatch)" }));
    const arc = state.type === "concave"
      ? `M ${VX - 2} ${VY - R} A ${R} ${R} 0 0 1 ${VX - 2} ${VY + R}`
      : `M ${VX + 2} ${VY - R} A ${R} ${R} 0 0 0 ${VX + 2} ${VY + R}`;
    layer.appendChild(el("path", { d: arc, fill: "none", stroke: "#334155", "stroke-width": 4, "stroke-linecap": "round" }));

    if (state.showLabels) {
      layer.appendChild(el("text", { x: 740, y: VY + 22, fill: "#334155", "font-weight": 700, "font-size": 14, text: "主軸" }));
      layer.appendChild(el("circle", { cx: VX, cy: VY, r: 4, fill: "#64748b" }));
      layer.appendChild(el("text", { x: VX + 6, y: VY + 18, fill: "#64748b", "font-size": 12, text: "鏡心 V" }));
      layer.appendChild(el("circle", { cx: Fp.x, cy: Fp.y, r: 5, fill: "#dc2626" }));
      layer.appendChild(el("text", {
        x: Fp.x + (state.type === "concave" ? -52 : 8),
        y: Fp.y - 10,
        fill: "#dc2626",
        "font-size": 12,
        text: state.type === "concave" ? "焦點 F" : "虛焦點 F"
      }));
      layer.appendChild(el("circle", { cx: C.x, cy: C.y, r: 3.5, fill: "#94a3b8" }));
      layer.appendChild(el("text", { x: C.x - 8, y: C.y - 12, fill: "#64748b", "font-size": 12, text: "C" }));
    }

    const tr = trace();
    if (tr.error) {
      $("readout").innerHTML = tr.error;
      return;
    }

    const { P, M1, r1, M2, r2, image, virtual } = tr;

    layer.appendChild(el("line", {
      x1: P.foot.x, y1: P.foot.y, x2: P.x, y2: P.y, stroke: "#475569", "stroke-width": 3
    }));
    layer.appendChild(el("polygon", {
      points: `${P.x},${P.y} ${P.x - 10},${P.y + 16} ${P.x + 10},${P.y + 16}`,
      fill: "#475569"
    }));
    layer.appendChild(el("text", { x: P.x + 12, y: P.y - 6, fill: "#334155", "font-size": 13, text: "物" }));

    if (state.showRays) {
      const drawRay = (x1, y1, x2, y2, color, dash, marker) => {
        layer.appendChild(el("line", {
          x1, y1, x2, y2, stroke: color, "stroke-width": 2.2,
          "stroke-dasharray": dash || "none",
          "marker-end": marker || null
        }));
      };
      drawRay(P.x, P.y, M1.x, M1.y, "#2563eb", null, "url(#arr-in)");
      drawRay(M1.x, M1.y, M1.x + r1.x * 220, M1.y + r1.y * 220, "#dc2626", null, "url(#arr-out)");
      drawRay(P.x, P.y, M2.x, M2.y, "#2563eb", null, "url(#arr-in)");
      drawRay(M2.x, M2.y, M2.x + r2.x * 220, M2.y + r2.y * 220, "#dc2626", null, "url(#arr-out)");
      if (virtual) {
        drawRay(M1.x, M1.y, M1.x - r1.x * 180, M1.y - r1.y * 180, "#94a3b8", "6 5", null);
        drawRay(M2.x, M2.y, M2.x - r2.x * 180, M2.y - r2.y * 180, "#94a3b8", "6 5", null);
      }
    }

    if (state.showImage && image) {
      const col = image.virtual ? "#059669" : "#15803d";
      layer.appendChild(el("line", {
        x1: image.foot.x, y1: image.foot.y, x2: image.top.x, y2: image.top.y,
        stroke: col, "stroke-width": 3, "stroke-dasharray": image.virtual ? "5 4" : "none"
      }));
      layer.appendChild(el("polygon", {
        points: `${image.top.x},${image.top.y} ${image.top.x - 9},${image.top.y + (image.top.y < VY ? 14 : -14)} ${image.top.x + 9},${image.top.y + (image.top.y < VY ? 14 : -14)}`,
        fill: col, opacity: 0.85
      }));
      layer.appendChild(el("text", {
        x: image.top.x + 10, y: image.top.y + 4, fill: col, "font-size": 13,
        text: image.virtual ? "虛像" : "實像"
      }));
    }

    $("obj-u-out").textContent = state.u + " cm";
    $("readout").innerHTML = describe(state.u, virtual, state.type);
  }

  $("mirror-type").addEventListener("change", (e) => {
    state.type = e.target.value;
    draw();
  });
  $("obj-u").addEventListener("input", (e) => {
    state.u = Number(e.target.value);
    draw();
  });
  ["show-rays", "show-image", "show-labels"].forEach((id) => {
    $(id).addEventListener("change", (e) => {
      state.showRays = $("show-rays").checked;
      state.showImage = $("show-image").checked;
      state.showLabels = $("show-labels").checked;
      draw();
    });
  });

  $("preset-far").addEventListener("click", () => {
    state.type = "concave";
    $("mirror-type").value = "concave";
    state.u = 70;
    $("obj-u").value = 70;
    draw();
  });
  $("preset-between").addEventListener("click", () => {
    state.type = "concave";
    $("mirror-type").value = "concave";
    state.u = 40;
    $("obj-u").value = 40;
    draw();
  });
  $("preset-inside").addEventListener("click", () => {
    state.type = "concave";
    $("mirror-type").value = "concave";
    state.u = 18;
    $("obj-u").value = 18;
    draw();
  });
  $("preset-convex").addEventListener("click", () => {
    state.type = "convex";
    $("mirror-type").value = "convex";
    state.u = 45;
    $("obj-u").value = 45;
    draw();
  });

  syncTypeFromUrl();
  draw();
})();
</script>
</body>
</html>
