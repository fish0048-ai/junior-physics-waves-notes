<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聲音走一趟，還是來回？</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#193247;font:16px/1.65 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1050px;margin:auto;padding:24px}small{color:#547082}h1{font-size:clamp(23px,4vw,31px);line-height:1.4;margin:6px 0 8px}p{margin:8px 0 16px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0;align-items:center}.control{flex:1 1 190px;max-width:340px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:15px}.control output{font-variant-numeric:tabular-nums;font-weight:600}input[type=range]{width:100%;min-height:38px;accent-color:#087fa4}select,button{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #afc4d0;border-radius:8px;color:#193247;background:white}select{max-width:100%}button{cursor:pointer}button.primary{background:#076b87;color:white;border-color:#076b87}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #e5a12a;outline-offset:3px}.visual{background:white;border:1px solid #dbe7ed;border-radius:16px;overflow:hidden}svg{display:block;width:100%;height:390px}svg text{font:14px system-ui,"Microsoft JhengHei",sans-serif;fill:#29495e}.readout{padding:12px 16px;background:#edf5f8;min-height:52px;font-variant-numeric:tabular-nums}.note{font-size:13px;color:#526c7d}.question{margin-top:18px;padding:16px;background:#eaf3f7;border-left:4px solid #087fa4;border-radius:7px}summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:600}details p{margin:6px 0}#status{color:#496579;font-size:14px}.legend{font-size:14px;margin:12px 0}.key{display:inline-block;padding:2px 8px;border-radius:6px;background:#e6f1f5;margin:2px}.panel{display:flex;gap:12px;flex-wrap:wrap}.panel>div{flex:1 1 200px}a{color:#075f7d}@media(max-width:480px){main{padding:14px}.controls{gap:10px}.control{flex-basis:140px}svg{height:430px}.readout{font-size:14px}}

</style><link rel="stylesheet" href="embed.css"></head><body><script>if(window.parent!==window)document.documentElement.classList.add('is-embed');</script><main><small>國中理化 · 3-3 聲波的反射</small><h1>聲音走一趟，還是來回？</h1><p>改變障礙物距離，再觀察訊號出發、反射、返回的時間。</p><div class="controls"><label>介質 <select id="medium"><option value="340">空氣 340 m/s</option><option value="1500">海水 1500 m/s</option></select></label><div class="control"><label for="distance">單程距離<output id="distance-out"></output></label><input id="distance" type="range" min="20" max="1000" step="10" value="170"></div><div class="control"><label for="progress">往返進度<output id="progress-out"></output></label><input id="progress" type="range" min="0" max="100" step="1" value="0"></div></div><div class="visual"><svg id="scene" role="img" aria-label="聲音走一趟，還是來回？的互動示意"></svg><div class="readout" id="result"></div></div><div class="controls"><button type="button" id="play" class="primary">播放</button><button type="button" id="reset">重設</button><span role="status" aria-live="polite" id="status">可調整條件觀察</span></div><div class="question"><b>先想一想：</b>回聲經過 1 秒返回，距離是否等於聲速乘 1 秒？<details><summary>查看解釋</summary><p>收到回聲前，聲音先走到障礙物，再沿路返回。總路程為 2d，因此單程距離 d＝vt÷2。</p></details></div><p class="note">使用固定聲速、單一反射面與靜止接收器；忽略衰減。畫面將每次往返放慢為 6 秒，讀數才是模型中的實際時間；不模擬多牆反射。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),svg=$('scene'),NS='http://www.w3.org/2000/svg';let W=800,H=390,frame=null,last=null,running=false;const C={blue:'#087fa4',red:'#d52b47',gold:'#a66a0a',green:'#258151',gray:'#92a8b7'};
function n(tag,attrs={},text=''){const node=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(text!==undefined)node.textContent=text;svg.append(node);return node}
function clear(){W=Math.max(260,svg.clientWidth);H=svg.clientHeight||390;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.replaceChildren()}
function line(x1,y1,x2,y2,color=C.blue,dash=false,width=2){return n('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,...(dash?{'stroke-dasharray':'5 5'}:{})})}
function text(x,y,t,anchor='middle',color){return n('text',{x,y,'text-anchor':anchor,...(color?{style:'fill:'+color}:{})},t)}
function circle(x,y,r,color,fill=color){return n('circle',{cx:x,cy:y,r,stroke:color,fill,'stroke-width':2})}
function rect(x,y,w,h,fill,stroke='none'){return n('rect',{x,y,width:Math.max(0,w),height:Math.max(0,h),rx:4,fill,stroke})}
function path(points,color=C.blue,dash=false,width=2){return n('path',{d:points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '),fill:'none',stroke:color,'stroke-width':width,...(dash?{'stroke-dasharray':'5 5'}:{})})}
function arrow(x1,y1,x2,y2,color=C.blue,dash=false){line(x1,y1,x2,y2,color,dash);const a=Math.atan2(y2-y1,x2-x1),l=8;return path([[x2-l*Math.cos(a-.45),y2-l*Math.sin(a-.45)],[x2,y2],[x2-l*Math.cos(a+.45),y2-l*Math.sin(a+.45)]],color)}
function val(id){return Number($(id).value)}function out(id,v){$(id).textContent=v}function bind(ids,fn){ids.forEach(id=>$(id).addEventListener('input',()=>{stop();fn();draw()}))}
function stop(msg='已暫停'){running=false;last=null;if($('play'))$('play').textContent='播放';out('status',msg)}
function playback(update){$('play').addEventListener('click',()=>{if(running){stop();return}running=true;last=null;$('play').textContent='暫停';out('status','播放中')});function tick(t){if(running){if(last!==null)update(Math.min(.1,(t-last)/1000));last=t;draw()}frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop('頁面隱藏，已暫停')});

let p=0;function draw(){clear();const d=val('distance'),v=val('medium'),x1=40,x2=W-40,y=H*.48,pos=p<=.5?x1+(x2-x1)*2*p:x2-(x2-x1)*(2*p-1);rect(x1-15,y-25,30,50,'#d8eaf0');rect(x2,y-70,12,140,'#7895a5');text(x1,y+55,'收發器');text(x2,y+100,'反射面');line(x1,y,x2,y,C.gray,true);circle(pos,y,9,p<=.5?C.blue:C.red);arrow(x1+10,y-85,x2-10,y-85);text(W/2,y-105,`去程 d＝${d} m`);arrow(x2-10,y+85,x1+10,y+85,C.red);text(W/2,y+115,'回程也是 d');text(W/2,40,p===1?'回聲已返回':p<.5?'去程：向障礙物傳播':'回程：反射後返回');out('distance-out',d+' m');out('progress-out',Math.round(p*100)+'%');$('progress').value=p*100;out('result',`經過時間 ${(2*d/v*p).toFixed(3)} s ｜ 已走路程 ${(2*d*p).toFixed(1)} m ｜ 往返時間 ${(2*d/v).toFixed(3)} s`)}
bind(['distance','medium'],()=>{p=0});bind(['progress'],()=>{p=val('progress')/100});$('reset').addEventListener('click',()=>{p=0;stop('已重設');draw()});$('play').addEventListener('click',()=>{if(p>=1)p=0});playback(dt=>{p=Math.min(1,p+dt/6);if(p>=1)stop('回聲已返回；單程距離＝總路程÷2')});

new ResizeObserver(draw).observe(svg);draw();let sent=0;new ResizeObserver(()=>{const height=Math.ceil(document.querySelector('main').getBoundingClientRect().height);if(height!==sent&&window.parent!==window){sent=height;window.parent.postMessage({type:'physics-animation:resize',height},location.origin==='null'?'*':location.origin)}}).observe(document.body);
})();</script></body></html>
