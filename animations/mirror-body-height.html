<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全身鏡為什麼只要身高一半？</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fa; color: #193247; font: 16px/1.65 system-ui, "Microsoft JhengHei", sans-serif; }
    main { max-width: 960px; margin: auto; padding: 22px; }
    h1 { font-size: clamp(22px, 4vw, 30px); margin: 6px 0 10px; line-height: 1.35; }
    small { color: #547082; }
    p { margin: 8px 0 14px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; margin: 16px 0; align-items: center; }
    .control { flex: 1 1 200px; max-width: 360px; }
    .control label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
    .control output { font-variant-numeric: tabular-nums; font-weight: 700; }
    input[type=range] { width: 100%; min-height: 44px; accent-color: #087fa4; }
    .visual { background: #fff; border: 1px solid #dbe7ed; border-radius: 14px; overflow: hidden; }
    svg#scene.mirror-body-scene {
      display: block; width: 100%; height: clamp(400px, 52vh, 520px);
      min-height: 400px;
      touch-action: none; cursor: grab;
      -webkit-user-select: none; user-select: none;
    }
    html.is-embed svg#scene.mirror-body-scene {
      height: clamp(400px, 46vw, 500px) !important;
      min-height: 400px !important;
      aspect-ratio: auto !important;
      max-height: none !important;
    }
    svg#scene.is-dragging { cursor: grabbing; }
    svg text { font: 14px system-ui, "Microsoft JhengHei", sans-serif; fill: #29495e; }
    .readout { padding: 12px 16px; background: #edf5f8; min-height: 52px; font-variant-numeric: tabular-nums; }
    .drag-hint { font-size: 14px; color: #0e7490; margin: 0 0 10px; }
    .legend { font-size: 14px; margin: 10px 0; }
    .key { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #e6f1f5; margin: 2px; }
    .note { font-size: 13px; color: #526c7d; }
  </style>
  <link rel="stylesheet" href="embed.css">
</head>
<body>
<script>if (window.parent !== window) document.documentElement.classList.add("is-embed");</script>
<main>
  <small>國中理化 · 4-2 平面鏡</small>
  <h1>全身鏡為什麼只要身高一半？</h1>
  <p>側視圖：撞鏡點在「物點—眼睛」中點高度，鏡面最短約 <strong>h/2</strong>。平面鏡<strong>虛像</strong>在鏡後，物距＝像距。</p>
  <p class="drag-hint"><strong>平板／手機：</strong>拖曳<strong>真人（物）</strong>改變到鏡距離；拖曳<strong>眼睛</strong>改高度。紅色虛線連到鏡後虛像。</p>
  <div class="controls">
    <div class="control">
      <label for="height">身高<output id="height-out"></output></label>
      <input id="height" type="range" min="150" max="185" step="1" value="170">
    </div>
    <div class="control">
      <label for="mirrorFrac">鏡面長度（占身高）<output id="mirror-out"></output></label>
      <input id="mirrorFrac" type="range" min="35" max="100" step="1" value="50">
    </div>
    <div class="control">
      <label>物距／像距<output id="dist-out"></output></label>
    </div>
  </div>
  <p class="legend">
    <span class="key" style="background:#fef08a">物（可拖）</span>
    <span class="key" style="background:#fecaca;color:#991b1b">虛像（鏡後）</span>
    <span class="key" style="background:#bbf7d0">最短鏡面 h/2</span>
  </p>
  <div class="visual">
    <svg id="scene" class="mirror-body-scene" preserveAspectRatio="xMidYMid meet" role="img" aria-label="全身鏡最小高度與虛像側視示意"></svg>
    <div class="readout" id="result"></div>
  </div>
  <p class="note">人離鏡遠近<strong>不改變</strong>所需最短鏡長；改變的是物距、像距（虛像位置會一起動）。</p>
</main>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const svg = $("scene");
  const NS = "http://www.w3.org/2000/svg";
  const C = {
    person: "#334155",
    virt: "#d52b47",
    mirrorNeed: "#059669",
    mirrorExtra: "#cbd5e1",
    headRay: "#ca8a04",
    footRay: "#2563eb",
    mid: "#dc2626",
    eye: "#15803d",
    floor: "#94a3b8"
  };
  let W = 800;
  let H = 460;
  let drag = null;
  const state = { xPerson: null, eyeY: null };
  const HEAD_R = 14;
  const PAD = 18;
  const VIRT_LABEL = 40;
  const MIRROR_GAP = 36;
  const TOP_MARGIN = 58;
  const BOTTOM_MARGIN = 54;

  function bodyLayout(H, hCm) {
    const footY = H - BOTTOM_MARGIN;
    const roomPx = footY - TOP_MARGIN - 2 * HEAD_R;
    const pxPerCm = Math.max(0.5, Math.min(roomPx / hCm, (H - TOP_MARGIN - BOTTOM_MARGIN) / hCm));
    const headY = footY - pxPerCm * hCm;
    const headTop = headY - 10 - HEAD_R;
    return { footY, pxPerCm, headY, headTop };
  }

  function n(tag, attrs = {}, text = "") {
    const el = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => { if (v != null && v !== "") el.setAttribute(k, v); });
    if (text) el.textContent = text;
    svg.append(el);
    return el;
  }

  function hitTarget(kind, cx, cy, r) {
    n("circle", {
      cx, cy, r,
      fill: "transparent", stroke: "transparent",
      "data-drag": kind,
      style: "cursor: grab; pointer-events: all"
    });
  }

  function clientToSvg(cx, cy) {
    const r = svg.getBoundingClientRect();
    return { x: ((cx - r.left) / r.width) * W, y: ((cy - r.top) / r.height) * H };
  }

  function arrow(x1, y1, x2, y2, color, width = 2) {
    n("line", { x1, y1, x2, y2, stroke: color, "stroke-width": width });
    const a = Math.atan2(y2 - y1, x2 - x1);
    const L = 9;
    n("path", {
      d: `M ${x2} ${y2} L ${x2 - L * Math.cos(a - 0.45)} ${y2 - L * Math.sin(a - 0.45)} L ${x2 - L * Math.cos(a + 0.45)} ${y2 - L * Math.sin(a + 0.45)} Z`,
      fill: color
    });
  }

  function dashLine(x1, y1, x2, y2, color, w = 1.5) {
    n("line", {
      x1, y1, x2, y2, stroke: color, "stroke-width": w,
      "stroke-dasharray": "6 5", opacity: "0.85"
    });
  }

  function drawPerson(x, footY, headY, eyeY, opts) {
    const { dashed, stroke, fillHead, label, labelX } = opts;
    const headCy = headY - 10;
    const bodyTop = headCy - HEAD_R;
    const sw = dashed ? 3 : 5;
    n("line", {
      x1: x, y1: footY, x2: x, y2: dashed ? bodyTop : headY,
      stroke, "stroke-width": sw, "stroke-linecap": "round",
      ...(dashed ? { "stroke-dasharray": "8 6", opacity: "0.95" } : {})
    });
    if (dashed) {
      n("circle", {
        cx: x, cy: headCy, r: HEAD_R,
        fill: "none", stroke, "stroke-width": 2.5,
        "stroke-dasharray": "8 6", "stroke-linecap": "round"
      });
      n("circle", {
        cx: x, cy: eyeY, r: 4.5,
        fill: "none", stroke, "stroke-width": 2,
        "stroke-dasharray": "4 4"
      });
    } else {
      n("circle", { cx: x, cy: headCy, r: HEAD_R, fill: fillHead, stroke, "stroke-width": 2 });
      n("circle", { cx: x - 5, cy: eyeY, r: 3.5, fill: C.eye });
      n("circle", { cx: x + 5, cy: eyeY, r: 3.5, fill: C.eye });
    }
    if (label) {
      n("text", {
        x: labelX, y: headCy + 5,
        "text-anchor": dashed ? "start" : "end",
        fill: dashed ? C.virt : stroke, "font-weight": "700"
      }, label);
    }
  }

  function sceneHeight() {
    const rect = svg.getBoundingClientRect();
    return Math.max(400, Math.round(rect.height) || 460);
  }

  function geom() {
    const hCm = Number($("height").value);
    const frac = Number($("mirrorFrac").value) / 100;
    const { footY, pxPerCm, headY } = bodyLayout(H, hCm);
    const defaultEye = footY - 0.86 * hCm * pxPerCm;
    const xMirror = PAD + (W - 2 * PAD) * 0.52;
    const maxVirtX = W - PAD - HEAD_R - VIRT_LABEL;
    const minPersonX = Math.max(PAD + HEAD_R, 2 * xMirror - maxVirtX);
    const maxPersonX = xMirror - MIRROR_GAP;
    if (state.xPerson == null) state.xPerson = minPersonX + (maxPersonX - minPersonX) * 0.35;
    if (state.eyeY == null) state.eyeY = defaultEye;
    state.xPerson = Math.min(maxPersonX, Math.max(minPersonX, state.xPerson));
    state.eyeY = Math.max(headY + HEAD_R + 6, Math.min(footY - 12, state.eyeY));
    const eyeY = state.eyeY;
    const xPerson = state.xPerson;
    const xVirt = 2 * xMirror - xPerson;
    const distCm = (xMirror - xPerson) / pxPerCm;
    return { hCm, frac, footY, pxPerCm, headY, eyeY, xPerson, xMirror, xVirt, distCm, minPersonX, maxPersonX };
  }

  function draw() {
    W = Math.max(300, svg.clientWidth);
    H = sceneHeight();
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", String(H));
    svg.replaceChildren();

    const g = geom();
    const {
      hCm, frac, footY, headY, eyeY, xPerson, xMirror, xVirt, distCm, pxPerCm
    } = g;
    $("height-out").textContent = hCm + " cm";
    $("mirror-out").textContent = Math.round(frac * 100) + " %";
    $("dist-out").textContent = distCm.toFixed(1) + " cm";

    const yHitHead = (headY + eyeY) / 2;
    const yHitFoot = (eyeY + footY) / 2;
    const minTop = yHitHead;
    const minBot = yHitFoot;
    const needFrac = 0.5;
    const centerY = (minTop + minBot) / 2;
    const actualLen = hCm * frac * pxPerCm;
    const topY = centerY - actualLen / 2;
    const botY = centerY + actualLen / 2;

    n("line", { x1: 24, y1: footY, x2: W - 24, y2: footY, stroke: C.floor, "stroke-width": 3 });
    n("text", { x: 28, y: footY + 22, "text-anchor": "start", "font-size": "13" }, "地面");

    const virtLabelX = Math.min(xVirt + 14, W - PAD - 4);
    n("rect", {
      x: xMirror + 2,
      y: Math.max(TOP_MARGIN - 8, headY - 10 - HEAD_R - 8),
      width: Math.max(0, W - PAD - xMirror - 2),
      height: footY - Math.max(TOP_MARGIN - 8, headY - 10 - HEAD_R - 8) + 8,
      fill: "#fff1f2", opacity: "0.55"
    });
    n("text", {
      x: Math.min(W - PAD, (xMirror + W - PAD) / 2),
      y: (headY + footY) / 2 + 5,
      "text-anchor": "middle", fill: C.virt, "font-size": "13", "font-weight": "700"
    }, "鏡後（虛像區）");

    drawPerson(xVirt, footY, headY, eyeY, {
      dashed: true, stroke: C.virt, label: "虛像", labelX: virtLabelX
    });

    n("line", {
      x1: xMirror, y1: Math.max(TOP_MARGIN - 6, headY - 10 - HEAD_R - 6),
      x2: xMirror, y2: Math.min(H - 8, footY + 16),
      stroke: "#64748b", "stroke-width": 4, opacity: "0.35"
    });

    drawPerson(xPerson, footY, headY, eyeY, {
      dashed: false, stroke: C.person, fillHead: "#fde68a", label: "物", labelX: Math.max(PAD, xPerson - 14)
    });
    n("text", {
      x: Math.max(PAD, xPerson - 14), y: Math.min(footY - 4, eyeY + 18),
      "text-anchor": "end", fill: C.eye, "font-weight": "700", "font-size": "13"
    }, "眼（可拖）");

    n("line", {
      x1: xMirror, y1: minTop, x2: xMirror, y2: minBot,
      stroke: C.mirrorNeed, "stroke-width": 8, "stroke-linecap": "round", opacity: "0.25"
    });
    n("line", {
      x1: xMirror, y1: topY, x2: xMirror, y2: botY,
      stroke: frac >= needFrac - 0.001 ? "#047857" : "#dc2626",
      "stroke-width": 12, "stroke-linecap": "round"
    });
    if (frac > needFrac + 0.001) {
      if (topY < minTop - 1) {
        n("line", { x1: xMirror, y1: topY, x2: xMirror, y2: minTop, stroke: C.mirrorExtra, "stroke-width": 8, "stroke-linecap": "round" });
        if (xMirror + 52 < W - PAD) {
          n("text", { x: xMirror + 14, y: (topY + minTop) / 2 + 4, "text-anchor": "start", fill: "#64748b", "font-size": "12" }, "多餘");
        }
      }
      if (botY > minBot + 1) {
        n("line", { x1: xMirror, y1: minBot, x2: xMirror, y2: botY, stroke: C.mirrorExtra, "stroke-width": 8, "stroke-linecap": "round" });
        if (xMirror + 52 < W - PAD) {
          n("text", { x: xMirror + 14, y: (minBot + botY) / 2 + 4, "text-anchor": "start", fill: "#64748b", "font-size": "12" }, "多餘");
        }
      }
    }

    const canHead = topY <= yHitHead && botY >= yHitHead;
    const canFoot = topY <= yHitFoot && botY >= yHitFoot;

    [
      { yObj: headY - 10 - HEAD_R + 4, yHit: yHitHead, yVirt: headY - 10 - HEAD_R + 4, color: C.headRay, name: "頭" },
      { yObj: footY, yHit: yHitFoot, yVirt: footY, color: C.footRay, name: "腳" }
    ].forEach(({ yObj, yHit, yVirt, color }) => {
      n("circle", { cx: xMirror, cy: yHit, r: 5, fill: C.mid, stroke: "#fff", "stroke-width": 1.5 });
      dashLine(xPerson, yObj, xMirror, yHit, "#94a3b8");
      dashLine(xPerson, eyeY, xMirror, yHit, "#94a3b8");
      if ((color === C.headRay && canHead) || (color === C.footRay && canFoot)) {
        arrow(xPerson, yObj, xMirror, yHit, color);
        arrow(xMirror, yHit, xPerson, eyeY, color);
        dashLine(xMirror, yHit, xVirt, yVirt, C.virt, 2);
        dashLine(xVirt, yVirt, xVirt, eyeY, C.virt, 1.2);
      } else {
        n("line", { x1: xPerson, y1: yObj, x2: xMirror, y2: yHit, stroke: color, "stroke-width": 1.5, "stroke-dasharray": "6 5", opacity: "0.4" });
      }
    });

    const braceX = Math.min(xMirror + 20, W - PAD - 8);
    n("line", { x1: braceX, y1: minTop, x2: braceX, y2: minBot, stroke: C.mirrorNeed, "stroke-width": 2 });
    n("line", { x1: braceX - 6, y1: minTop, x2: braceX + 6, y2: minTop, stroke: C.mirrorNeed, "stroke-width": 2 });
    n("line", { x1: braceX - 6, y1: minBot, x2: braceX + 6, y2: minBot, stroke: C.mirrorNeed, "stroke-width": 2 });
    const h2Label = `最短 ≈ h/2（${(hCm / 2).toFixed(0)} cm）`;
    if (braceX + 96 < W - PAD) {
      n("text", { x: braceX + 8, y: (minTop + minBot) / 2 + 5, "text-anchor": "start", fill: C.mirrorNeed, "font-weight": "700", "font-size": "13" }, h2Label);
    } else {
      n("text", { x: xMirror, y: Math.min(footY + 14, H - PAD), "text-anchor": "middle", fill: C.mirrorNeed, "font-weight": "700", "font-size": "12" }, h2Label);
    }

    dashLine(xPerson, eyeY, xVirt, eyeY, C.virt, 1);
    n("text", {
      x: (xPerson + xVirt) / 2, y: Math.max(PAD + 10, eyeY - 10),
      "text-anchor": "middle", fill: C.virt, "font-size": "12"
    }, "物距＝像距");

    n("text", { x: xMirror, y: H - 18, "text-anchor": "middle", "font-weight": "700" }, "平面鏡");

    hitTarget("person", xPerson, (headY + footY) / 2, Math.max(36, (footY - headY) / 2 + 8));
    hitTarget("eye", xPerson, eyeY, 28);

    const actualCm = (hCm * frac).toFixed(0);
    const minCm = (hCm / 2).toFixed(0);
    let mirrorMsg;
    if (frac < needFrac - 0.001) {
      const miss = [];
      if (!canHead) miss.push("頭頂");
      if (!canFoot) miss.push("腳尖");
      mirrorMsg = `鏡長 ${actualCm} cm 短於 h/2 → 看不到${miss.join("、")}。`;
    } else if (Math.abs(frac - needFrac) < 0.02) {
      mirrorMsg = `鏡長 ${actualCm} cm ≈ h/2，可見全身。`;
    } else {
      mirrorMsg = `鏡長 ${actualCm} cm 已足夠（最短 h/2＝${minCm} cm）。`;
    }
    $("result").textContent =
      `${mirrorMsg} 物距 ${distCm.toFixed(1)} cm → 虛像在鏡後 ${distCm.toFixed(1)} cm（紅色虛線，光未真正經過）。`;
  }

  function onPointerDown(e) {
    const t = e.target;
    if (!t.dataset || !t.dataset.drag) return;
    drag = { kind: t.dataset.drag, id: e.pointerId };
    svg.setPointerCapture(e.pointerId);
    svg.classList.add("is-dragging");
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!drag || drag.id !== e.pointerId) return;
    W = Math.max(300, svg.clientWidth);
    H = svg.clientHeight || 460;
    const p = clientToSvg(e.clientX, e.clientY);
    const hCm = Number($("height").value);
    const { footY, headY } = bodyLayout(H, hCm);
    const xMirror = PAD + (W - 2 * PAD) * 0.52;
    const maxVirtX = W - PAD - HEAD_R - VIRT_LABEL;
    const minPersonX = Math.max(PAD + HEAD_R, 2 * xMirror - maxVirtX);
    const maxPersonX = xMirror - MIRROR_GAP;
    if (drag.kind === "person") {
      state.xPerson = Math.min(maxPersonX, Math.max(minPersonX, p.x));
    } else if (drag.kind === "eye") {
      state.eyeY = Math.max(headY + HEAD_R + 6, Math.min(footY - 12, p.y));
    }
    draw();
    e.preventDefault();
  }

  function onPointerUp(e) {
    if (!drag || drag.id !== e.pointerId) return;
    drag = null;
    svg.classList.remove("is-dragging");
    try { svg.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  svg.addEventListener("pointerdown", onPointerDown);
  svg.addEventListener("pointermove", onPointerMove);
  svg.addEventListener("pointerup", onPointerUp);
  svg.addEventListener("pointercancel", onPointerUp);

  $("height").addEventListener("input", () => { state.eyeY = null; draw(); });
  $("mirrorFrac").addEventListener("input", draw);
  new ResizeObserver(draw).observe(svg);
  requestAnimationFrame(() => requestAnimationFrame(draw));
  window.addEventListener("load", draw);
})();
</script>
<script src="embed-resize.js"></script>
</body>
</html>
