<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全身鏡為什麼只要身高一半？</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fa; color: #193247; font: 16px/1.65 system-ui, "Microsoft JhengHei", sans-serif; }
    main { max-width: 960px; margin: auto; padding: 22px; }
    h1 { font-size: clamp(22px, 4vw, 30px); margin: 6px 0 10px; line-height: 1.35; }
    small { color: #547082; }
    p { margin: 8px 0 14px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; margin: 16px 0; align-items: center; }
    .control { flex: 1 1 200px; max-width: 360px; }
    .control label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
    .control output { font-variant-numeric: tabular-nums; font-weight: 700; }
    input[type=range] { width: 100%; min-height: 44px; accent-color: #087fa4; }
    .visual { background: #fff; border: 1px solid #dbe7ed; border-radius: 14px; overflow: hidden; }
    svg#scene.mirror-body-scene {
      display: block; width: 100%; height: clamp(400px, 52vh, 520px);
      min-height: 400px;
      touch-action: none; cursor: grab;
      -webkit-user-select: none; user-select: none;
    }
    html.is-embed svg#scene.mirror-body-scene {
      height: clamp(400px, 46vw, 500px) !important;
      min-height: 400px !important;
      aspect-ratio: auto !important;
      max-height: none !important;
    }
    svg#scene.is-dragging { cursor: grabbing; }
    svg text { font: 14px system-ui, "Microsoft JhengHei", sans-serif; fill: #29495e; }
    .readout { padding: 12px 16px; background: #edf5f8; min-height: 52px; font-variant-numeric: tabular-nums; }
    .drag-hint { font-size: 14px; color: #0e7490; margin: 0 0 10px; }
    .legend { font-size: 14px; margin: 10px 0; }
    .key { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #e6f1f5; margin: 2px; }
    .note { font-size: 13px; color: #526c7d; }
    .control-check { flex: 1 1 100%; max-width: none; font-size: 15px; min-height: 44px; display: flex; align-items: center; gap: 10px; }
    .control-short.is-hidden { display: none; }
  </style>
  <link rel="stylesheet" href="embed.css">
</head>
<body>
<script>if (window.parent !== window) document.documentElement.classList.add("is-embed");</script>
<main>
  <small>國中理化 · 4-2 平面鏡</small>
  <h1>全身鏡為什麼只要身高一半？</h1>
  <p>側視圖：撞鏡點在「物點—眼睛」中點高度，鏡面最短約 <strong>h/2</strong>。平面鏡<strong>虛像</strong>在鏡後，物距＝像距。</p>
  <p class="drag-hint"><strong>平板／手機：</strong>較矮者預設<strong>靠近鏡子</strong>；兩人皆可拖曳改物距。紅／粉虛線為鏡後虛像。</p>
  <div class="controls">
    <label class="control-check"><input type="checkbox" id="showShort"> 加入<strong>較矮的人</strong>（掛鏡以較矮者 h/2 為基準，鏡面上下緣涵蓋兩人）</label>
    <div class="control">
      <label for="height">較高者身高<output id="height-out"></output></label>
      <input id="height" type="range" min="150" max="185" step="1" value="170">
    </div>
    <div class="control control-short is-hidden" id="short-height-wrap">
      <label for="heightShort">較矮者身高<output id="height-short-out"></output></label>
      <input id="heightShort" type="range" min="130" max="165" step="1" value="145">
    </div>
    <div class="control">
      <label>最短鏡面（極限值）<output id="mirror-req-out"></output></label>
    </div>
    <div class="control">
      <label>物距／像距<output id="dist-out"></output></label>
    </div>
  </div>
  <p class="legend">
    <span class="key" style="background:#fef08a">物（可拖）</span>
    <span class="key" style="background:#fecaca;color:#991b1b">虛像（鏡後）</span>
    <span class="key" style="background:#bbf7d0">極限鏡面（cm）</span>
    <span class="key" style="background:#e9d5ff;color:#6b21a8">較矮者（可拖）</span>
  </p>
  <div class="visual">
    <svg id="scene" class="mirror-body-scene" preserveAspectRatio="xMidYMid meet" role="img" aria-label="全身鏡最小高度與虛像側視示意"></svg>
    <div class="readout" id="result"></div>
  </div>
  <p class="note">人離鏡遠近<strong>不改變</strong>個人所需 h/2。家中共用鏡：以<strong>較矮者</strong>的 h/2 為基準，鏡面上下緣須同時涵蓋兩人的頭頂與腳尖光路（綠色區間）。</p>
</main>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const svg = $("scene");
  const NS = "http://www.w3.org/2000/svg";
  const C = {
    person: "#334155",
    virt: "#d52b47",
    mirrorNeed: "#059669",
    mirrorExtra: "#cbd5e1",
    headRay: "#ca8a04",
    footRay: "#2563eb",
    mid: "#dc2626",
    eye: "#15803d",
    floor: "#94a3b8",
    short: "#7c3aed",
    shortHead: "#ddd6fe"
  };
  let W = 800;
  let H = 460;
  let drag = null;
  const state = { xPerson: null, xPerson2: null, eyeY: null };
  const PERSON_GAP = 44;
  /** 誇張大頭，方便在頭內拖曳眼睛看出光路差異 */
  const HEAD_R = 24;
  const EYE_R = 4.5;
  const EYE_SPREAD = 9;
  const PAD = 18;
  const VIRT_LABEL = 40;
  const MIRROR_GAP = 36;
  const TOP_MARGIN = 64;
  const BOTTOM_MARGIN = 54;

  function bodyLayout(H, hCm) {
    const footY = H - BOTTOM_MARGIN;
    const roomPx = footY - TOP_MARGIN - 2 * HEAD_R;
    const pxPerCm = Math.max(0.5, Math.min(roomPx / hCm, (H - TOP_MARGIN - BOTTOM_MARGIN) / hCm));
    const headTop = footY - pxPerCm * hCm;
    const headCy = headTop + HEAD_R;
    const neckY = headCy + HEAD_R;
    return { footY, pxPerCm, headTop, headCy, neckY };
  }

  function n(tag, attrs = {}, text = "") {
    const el = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => { if (v != null && v !== "") el.setAttribute(k, v); });
    if (text) el.textContent = text;
    svg.append(el);
    return el;
  }

  function hitTarget(kind, cx, cy, r) {
    n("circle", {
      cx, cy, r,
      fill: "transparent", stroke: "transparent",
      "data-drag": kind,
      style: "cursor: grab; pointer-events: all"
    });
  }

  function clientToSvg(cx, cy) {
    const r = svg.getBoundingClientRect();
    return { x: ((cx - r.left) / r.width) * W, y: ((cy - r.top) / r.height) * H };
  }

  function arrow(x1, y1, x2, y2, color, width = 2) {
    n("line", { x1, y1, x2, y2, stroke: color, "stroke-width": width });
    const a = Math.atan2(y2 - y1, x2 - x1);
    const L = 9;
    n("path", {
      d: `M ${x2} ${y2} L ${x2 - L * Math.cos(a - 0.45)} ${y2 - L * Math.sin(a - 0.45)} L ${x2 - L * Math.cos(a + 0.45)} ${y2 - L * Math.sin(a + 0.45)} Z`,
      fill: color
    });
  }

  function dashLine(x1, y1, x2, y2, color, w = 1.5) {
    n("line", {
      x1, y1, x2, y2, stroke: color, "stroke-width": w,
      "stroke-dasharray": "6 5", opacity: "0.85"
    });
  }

  function drawPerson(x, footY, neckY, headCy, eyeY, opts) {
    const { dashed, stroke, fillHead, label, labelX } = opts;
    const sw = dashed ? 3 : 5;
    n("line", {
      x1: x, y1: footY, x2: x, y2: neckY,
      stroke, "stroke-width": sw, "stroke-linecap": "round",
      ...(dashed ? { "stroke-dasharray": "8 6", opacity: "0.95" } : {})
    });
    if (dashed) {
      n("circle", {
        cx: x, cy: headCy, r: HEAD_R,
        fill: "none", stroke, "stroke-width": 2.5,
        "stroke-dasharray": "8 6", "stroke-linecap": "round"
      });
    } else {
      n("circle", { cx: x, cy: headCy, r: HEAD_R, fill: fillHead, stroke, "stroke-width": 2.5 });
    }
    n("circle", {
      cx: x - EYE_SPREAD, cy: eyeY, r: EYE_R,
      fill: dashed ? "none" : C.eye,
      stroke: dashed ? stroke : C.eye,
      "stroke-width": dashed ? 2 : 0,
      ...(dashed ? { "stroke-dasharray": "3 3" } : {})
    });
    n("circle", {
      cx: x + EYE_SPREAD, cy: eyeY, r: EYE_R,
      fill: dashed ? "none" : C.eye,
      stroke: dashed ? stroke : C.eye,
      "stroke-width": dashed ? 2 : 0,
      ...(dashed ? { "stroke-dasharray": "3 3" } : {})
    });
    if (label) {
      n("text", {
        x: labelX, y: headCy + 5,
        "text-anchor": dashed ? "start" : "end",
        fill: dashed ? C.virt : stroke, "font-weight": "700"
      }, label);
    }
  }

  function sceneHeight() {
    const rect = svg.getBoundingClientRect();
    return Math.max(400, Math.round(rect.height) || 460);
  }

  function showShortPerson() {
    return $("showShort").checked;
  }

  function syncShortControls() {
    const on = showShortPerson();
    $("short-height-wrap").classList.toggle("is-hidden", !on);
    const tall = Number($("height").value);
    const shortMax = Math.max(130, tall - 12);
    $("heightShort").max = String(shortMax);
    if (Number($("heightShort").value) > shortMax) $("heightShort").value = String(shortMax);
    if (on) $("height-short-out").textContent = $("heightShort").value + " cm";
  }

  function buildFigure(hCm, footY, pxPerCm, eyeOffset) {
    const headTop = footY - hCm * pxPerCm;
    const headCy = headTop + HEAD_R;
    const neckY = headCy + HEAD_R;
    const eyeMin = headCy - HEAD_R + 8;
    const eyeMax = headCy + HEAD_R - 8;
    const eyeY = Math.max(eyeMin, Math.min(eyeMax, headCy + eyeOffset));
    return {
      hCm, footY, headTop, headCy, neckY, eyeY,
      yHitHead: (headTop + eyeY) / 2,
      yHitFoot: (eyeY + footY) / 2
    };
  }

  function geom() {
    syncShortControls();
    const hCm = Number($("height").value);
    const hShort = showShortPerson() ? Number($("heightShort").value) : null;
    const hLayout = hShort ? Math.max(hCm, hShort) : hCm;
    const { footY, pxPerCm } = bodyLayout(H, hLayout);
    const xMirror = PAD + (W - 2 * PAD) * 0.52;
    const maxVirtX = W - PAD - HEAD_R - VIRT_LABEL;
    const minPersonX = Math.max(PAD + HEAD_R, 2 * xMirror - maxVirtX);
    const maxPersonX = xMirror - MIRROR_GAP;

    const mainPre = buildFigure(hCm, footY, pxPerCm, 6);
    if (state.eyeY == null) state.eyeY = mainPre.eyeY;
    const eyeOffset = state.eyeY - mainPre.headCy;
    const main = buildFigure(hCm, footY, pxPerCm, eyeOffset);
    state.eyeY = main.eyeY;

    const maxShortX = xMirror - MIRROR_GAP;
    if (showShortPerson()) {
      if (state.xPerson2 == null) state.xPerson2 = maxShortX;
      state.xPerson2 = Math.min(maxShortX, Math.max(minPersonX + PERSON_GAP, state.xPerson2));
      const maxTallX = state.xPerson2 - PERSON_GAP;
      if (state.xPerson == null) {
        state.xPerson = minPersonX + Math.max(0, maxTallX - minPersonX) * 0.25;
      }
      state.xPerson = Math.min(maxTallX, Math.max(minPersonX, state.xPerson));
      if (state.xPerson2 <= state.xPerson + PERSON_GAP - 1) {
        state.xPerson2 = Math.min(maxShortX, state.xPerson + PERSON_GAP);
      }
    } else {
      state.xPerson2 = null;
      if (state.xPerson == null) state.xPerson = minPersonX + (maxPersonX - minPersonX) * 0.35;
      state.xPerson = Math.min(maxPersonX, Math.max(minPersonX, state.xPerson));
    }

    const short = hShort != null ? buildFigure(hShort, footY, pxPerCm, eyeOffset) : null;
    let minTop = main.yHitHead;
    let minBot = main.yHitFoot;
    let refHCm = hCm;
    if (short) {
      minTop = Math.min(main.yHitHead, short.yHitHead);
      minBot = Math.max(main.yHitFoot, short.yHitFoot);
      refHCm = hShort;
    }

    const xPerson = state.xPerson;
    const xPerson2 = state.xPerson2;
    const xVirt = 2 * xMirror - xPerson;
    const xVirt2 = xPerson2 != null ? 2 * xMirror - xPerson2 : null;
    const distCm = (xMirror - xPerson) / pxPerCm;
    const distShortCm = xPerson2 != null ? (xMirror - xPerson2) / pxPerCm : null;
    return {
      hCm, hShort, footY, pxPerCm, main, short, minTop, minBot, refHCm,
      eyeY: main.eyeY, xPerson, xPerson2, xMirror, xVirt, xVirt2, distCm, distShortCm
    };
  }

  function drawRaysFor(xP, xV, fig, xMirror, canHead, canFoot, headColor, footColor, withVirt, virtColor = C.virt) {
    const { headTop, eyeY, footY, yHitHead, yHitFoot } = fig;
    [
      { yObj: headTop + 3, yHit: yHitHead, color: headColor, ok: canHead },
      { yObj: footY, yHit: yHitFoot, color: footColor, ok: canFoot }
    ].forEach(({ yObj, yHit, color, ok }) => {
      if (ok) {
        arrow(xP, yObj, xMirror, yHit, color, 2);
        arrow(xMirror, yHit, xP, eyeY, color, 2);
        if (withVirt && xV != null) dashLine(xMirror, yHit, xV, yObj, virtColor, 1.5);
      } else {
        n("line", {
          x1: xP, y1: yObj, x2: xMirror, y2: yHit,
          stroke: color, "stroke-width": 1.2, "stroke-dasharray": "5 4", opacity: "0.4"
        });
      }
    });
  }

  function draw() {
    W = Math.max(300, svg.clientWidth);
    H = sceneHeight();
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", String(H));
    svg.replaceChildren();

    const g = geom();
    const {
      hCm, hShort, footY, pxPerCm, main, short, minTop, minBot, refHCm,
      eyeY, xPerson, xPerson2, xMirror, xVirt, xVirt2, distCm, distShortCm
    } = g;
    const { headTop, headCy, neckY } = main;
    $("height-out").textContent = hCm + " cm";
    $("dist-out").textContent = short && distShortCm != null
      ? `高 ${distCm.toFixed(1)}／矮 ${distShortCm.toFixed(1)} cm`
      : distCm.toFixed(1) + " cm";

    const reqLenPx = minBot - minTop;
    const reqCm = reqLenPx / pxPerCm;
    const refHalfCm = refHCm / 2;
    const topY = minTop;
    const botY = minBot;
    $("mirror-req-out").textContent = short
      ? `${reqCm.toFixed(1)} cm（較矮者 h/2≈${refHalfCm.toFixed(0)} cm）`
      : `${reqCm.toFixed(1)} cm（≈ h/2）`;

    const sceneHeadTop = short ? Math.min(main.headTop, short.headTop) : main.headTop;

    n("line", { x1: 24, y1: footY, x2: W - 24, y2: footY, stroke: C.floor, "stroke-width": 3 });
    n("text", { x: 28, y: footY + 22, "text-anchor": "start", "font-size": "13" }, "地面");

    const virtLabelX = Math.min(xVirt + 14, W - PAD - 4);
    n("rect", {
      x: xMirror + 2,
      y: Math.max(TOP_MARGIN - 8, sceneHeadTop - 8),
      width: Math.max(0, W - PAD - xMirror - 2),
      height: footY - Math.max(TOP_MARGIN - 8, sceneHeadTop - 8) + 8,
      fill: "#fff1f2", opacity: "0.55"
    });
    n("text", {
      x: Math.min(W - PAD, (xMirror + W - PAD) / 2),
      y: (main.neckY + footY) / 2 + 5,
      "text-anchor": "middle", fill: C.virt, "font-size": "13", "font-weight": "700"
    }, "鏡後（虛像區）");

    if (short && xVirt2 != null && xPerson2 != null) {
      const v2LabelX = Math.min(xVirt2 + 14, W - PAD - 4);
      drawPerson(xVirt2, footY, short.neckY, short.headCy, short.eyeY, {
        dashed: true, stroke: "#db2777", label: "虛像（矮）", labelX: v2LabelX
      });
    }
    drawPerson(xVirt, footY, neckY, headCy, eyeY, {
      dashed: true, stroke: C.virt, label: "虛像（高）", labelX: virtLabelX
    });

    n("line", {
      x1: xMirror, y1: Math.max(TOP_MARGIN - 6, sceneHeadTop - 6),
      x2: xMirror, y2: Math.min(H - 8, footY + 16),
      stroke: "#64748b", "stroke-width": 4, opacity: "0.35"
    });

    if (short && xPerson2 != null) {
      drawPerson(xPerson2, footY, short.neckY, short.headCy, short.eyeY, {
        dashed: false, stroke: C.short, fillHead: C.shortHead,
        label: "較矮", labelX: Math.max(PAD, xPerson2 - 14)
      });
      hitTarget("person2", xPerson2, (short.neckY + footY) / 2, Math.max(32, (footY - short.neckY) / 2 + 10));
    }

    drawPerson(xPerson, footY, neckY, headCy, eyeY, {
      dashed: false, stroke: C.person, fillHead: "#fde68a", label: "較高", labelX: Math.max(PAD, xPerson - 14)
    });
    n("text", {
      x: Math.max(PAD, xPerson - 14), y: headCy + HEAD_R + 10,
      "text-anchor": "end", fill: C.eye, "font-weight": "700", "font-size": "13"
    }, "眼（可拖）");

    n("line", {
      x1: xMirror, y1: minTop, x2: xMirror, y2: minBot,
      stroke: C.mirrorNeed, "stroke-width": 8, "stroke-linecap": "round", opacity: "0.35"
    });
    n("line", {
      x1: xMirror, y1: topY, x2: xMirror, y2: botY,
      stroke: "#047857",
      "stroke-width": 12, "stroke-linecap": "round"
    });

    const cover = () => ({ head: true, foot: true });
    const cMain = cover();
    const cShort = short ? cover() : null;

    [main.yHitHead, main.yHitFoot].forEach((ym) => {
      n("circle", { cx: xMirror, cy: ym, r: 5, fill: C.mid, stroke: "#fff", "stroke-width": 1.5 });
    });
    if (short) {
      [short.yHitHead, short.yHitFoot].forEach((ym) => {
        n("circle", { cx: xMirror, cy: ym, r: 4, fill: "#a855f7", stroke: "#fff", "stroke-width": 1 });
      });
    }

    drawRaysFor(xPerson, xVirt, main, xMirror, cMain.head, cMain.foot, C.headRay, C.footRay, true, C.virt);
    if (short && xPerson2 != null && xVirt2 != null) {
      drawRaysFor(xPerson2, xVirt2, short, xMirror, cShort.head, cShort.foot, "#c084fc", "#818cf8", true, "#db2777");
      dashLine(xPerson2, short.eyeY, xVirt2, short.eyeY, "#db2777", 1);
    }

    const braceX = Math.min(xMirror + 20, W - PAD - 8);
    n("line", { x1: braceX, y1: minTop, x2: braceX, y2: minBot, stroke: C.mirrorNeed, "stroke-width": 2 });
    n("line", { x1: braceX - 6, y1: minTop, x2: braceX + 6, y2: minTop, stroke: C.mirrorNeed, "stroke-width": 2 });
    n("line", { x1: braceX - 6, y1: minBot, x2: braceX + 6, y2: minBot, stroke: C.mirrorNeed, "stroke-width": 2 });
    const h2Label = short
      ? `較矮者 h/2≈${refHalfCm.toFixed(0)} cm；共用 ${reqCm.toFixed(0)} cm`
      : `最短 ≈ h/2（${refHalfCm.toFixed(0)} cm）`;
    if (braceX + 120 < W - PAD) {
      n("text", { x: braceX + 8, y: (minTop + minBot) / 2 + 5, "text-anchor": "start", fill: C.mirrorNeed, "font-weight": "700", "font-size": "12" }, h2Label);
    } else {
      n("text", { x: xMirror, y: Math.min(footY + 14, H - PAD), "text-anchor": "middle", fill: C.mirrorNeed, "font-weight": "700", "font-size": "11" }, h2Label);
    }

    dashLine(xPerson, eyeY, xVirt, eyeY, C.virt, 1);
    n("text", {
      x: (xPerson + xVirt) / 2, y: Math.max(PAD + 10, eyeY - 10),
      "text-anchor": "middle", fill: C.virt, "font-size": "12"
    }, "物距＝像距");

    n("text", { x: xMirror, y: H - 18, "text-anchor": "middle", "font-weight": "700" }, "平面鏡");

    hitTarget("person", xPerson, (neckY + footY) / 2, Math.max(36, (footY - neckY) / 2 + 12));
    hitTarget("eye", xPerson, eyeY, 36);

    const mirrorMsg = short
      ? `綠色鏡面＝極限長度 ${reqCm.toFixed(1)} cm（較矮 ${hShort} cm 的 h/2≈${refHalfCm.toFixed(0)} cm；兩人共用時取光路聯集）。`
      : `綠色鏡面＝極限長度 ${reqCm.toFixed(1)} cm（約身高的一半，剛好可見全身）。`;
    const distNote = short && distShortCm != null
      ? `物距：較高 ${distCm.toFixed(1)} cm、較矮 ${distShortCm.toFixed(1)} cm（各與虛像等距）。`
      : `物距 ${distCm.toFixed(1)} cm → 虛像在鏡後同距離。`;
    $("result").textContent = `${mirrorMsg} ${distNote}`;
  }

  function onPointerDown(e) {
    const t = e.target;
    if (!t.dataset || !t.dataset.drag) return;
    drag = { kind: t.dataset.drag, id: e.pointerId };
    svg.setPointerCapture(e.pointerId);
    svg.classList.add("is-dragging");
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!drag || drag.id !== e.pointerId) return;
    W = Math.max(300, svg.clientWidth);
    H = sceneHeight();
    const p = clientToSvg(e.clientX, e.clientY);
    const hCm = Number($("height").value);
    const hShort = showShortPerson() ? Number($("heightShort").value) : null;
    const { footY, pxPerCm } = bodyLayout(H, hShort ? Math.max(hCm, hShort) : hCm);
    const main = buildFigure(hCm, footY, pxPerCm, state.eyeY != null ? state.eyeY - buildFigure(hCm, footY, pxPerCm, 6).headCy : 6);
    const xMirror = PAD + (W - 2 * PAD) * 0.52;
    const maxVirtX = W - PAD - HEAD_R - VIRT_LABEL;
    const minPersonX = Math.max(PAD + HEAD_R, 2 * xMirror - maxVirtX);
    const maxPersonX = xMirror - MIRROR_GAP;
    const maxShortX = xMirror - MIRROR_GAP;
    if (drag.kind === "person2") {
      const minP2 = (state.xPerson || minPersonX) + PERSON_GAP;
      state.xPerson2 = Math.min(maxShortX, Math.max(minP2, p.x));
    } else if (drag.kind === "person") {
      const maxTallX = showShortPerson() ? (state.xPerson2 || maxShortX) - PERSON_GAP : maxPersonX;
      state.xPerson = Math.min(maxTallX, Math.max(minPersonX, p.x));
    } else if (drag.kind === "eye") {
      const eyeMin = main.headCy - HEAD_R + 8;
      const eyeMax = main.headCy + HEAD_R - 8;
      state.eyeY = Math.max(eyeMin, Math.min(eyeMax, p.y));
    }
    draw();
    e.preventDefault();
  }

  function onPointerUp(e) {
    if (!drag || drag.id !== e.pointerId) return;
    drag = null;
    svg.classList.remove("is-dragging");
    try { svg.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  svg.addEventListener("pointerdown", onPointerDown);
  svg.addEventListener("pointermove", onPointerMove);
  svg.addEventListener("pointerup", onPointerUp);
  svg.addEventListener("pointercancel", onPointerUp);

  $("height").addEventListener("input", () => { state.eyeY = null; draw(); });
  $("heightShort").addEventListener("input", draw);
  $("showShort").addEventListener("change", () => { state.xPerson2 = null; draw(); });
  new ResizeObserver(draw).observe(svg);
  requestAnimationFrame(() => requestAnimationFrame(draw));
  window.addEventListener("load", draw);
})();
</script>
<script src="embed-resize.js"></script>
</body>
</html>
