<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同樣加熱，升溫為何不同？</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#193247;font:16px/1.65 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1050px;margin:auto;padding:24px}small{color:#547082}h1{font-size:clamp(23px,4vw,31px);line-height:1.4;margin:6px 0 8px}p{margin:8px 0 16px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0;align-items:center}.control{flex:1 1 190px;max-width:340px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:15px}.control output{font-variant-numeric:tabular-nums;font-weight:600}input[type=range]{width:100%;min-height:38px;accent-color:#087fa4}select,button{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #afc4d0;border-radius:8px;color:#193247;background:white}select{max-width:100%}button{cursor:pointer}button.primary{background:#076b87;color:white;border-color:#076b87}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #e5a12a;outline-offset:3px}.visual{background:white;border:1px solid #dbe7ed;border-radius:16px;overflow:hidden}svg{display:block;width:100%;height:390px}svg text{font:14px system-ui,"Microsoft JhengHei",sans-serif;fill:#29495e}.readout{padding:12px 16px;background:#edf5f8;min-height:52px;font-variant-numeric:tabular-nums}.note{font-size:13px;color:#526c7d}.question{margin-top:18px;padding:16px;background:#eaf3f7;border-left:4px solid #087fa4;border-radius:7px}summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:600}details p{margin:6px 0}#status{color:#496579;font-size:14px}.legend{font-size:14px;margin:12px 0}.key{display:inline-block;padding:2px 8px;border-radius:6px;background:#e6f1f5;margin:2px}.panel{display:flex;gap:12px;flex-wrap:wrap}.panel>div{flex:1 1 200px}a{color:#075f7d}@media(max-width:480px){main{padding:14px}.controls{gap:10px}.control{flex-basis:140px}svg{height:430px}.readout{font-size:14px}}

html.is-embed body{background:#f8fbfd}
html.is-embed main{padding:14px 16px 12px;max-width:none}
html.is-embed h1{font-size:clamp(20px,3.8vw,28px);margin:6px 0 10px;line-height:1.35}
html.is-embed small{font-size:13px}
html.is-embed p{margin:8px 0 14px;font-size:15px;line-height:1.55}
html.is-embed main>header+p,html.is-embed main>small+h1+p{margin:0 0 12px}
html.is-embed .visual svg{min-height:360px!important;height:380px!important;max-height:none!important}
html.is-embed svg{display:block;width:100%}
html.is-embed .visual{border-radius:14px}
html.is-embed .controls{margin:14px 0;gap:12px}
html.is-embed button,html.is-embed select{min-height:44px;padding:8px 12px;font-size:15px}
html.is-embed .readout,.legend,.question,.control label,#status{font-size:14px}
html.is-embed .readout{padding:10px 14px;min-height:48px}
html.is-embed .note{font-size:13px;line-height:1.55;margin:10px 0 0}
html.is-embed .question{margin-top:16px;padding:14px 16px}
html.is-embed summary{min-height:44px;padding:8px 0}
html.is-embed input[type=range]{min-height:38px}
html.is-embed .control{flex:1 1 200px}
html.is-embed .key{font-size:13px}</style></head><body><script>if(window.parent!==window)document.documentElement.classList.add('is-embed');</script><main><small>國中理化 · 5-2 熱量與比熱</small><h1>同樣加熱，升溫為何不同？</h1><p>切換熱平衡與加熱比較，調整質量並觀察溫度曲線。</p><div class="controls"><label>實驗 <select id="mode"><option value="heating">加熱比較</option><option value="mixing">熱平衡</option></select></label><div class="control"><label for="mass">A 杯水質量<output id="mass-out"></output></label><input id="mass" type="range" min="100" max="400" step="50" value="100"></div><div class="control"><label for="progress">觀察進度<output id="progress-out"></output></label><input id="progress" type="range" min="0" max="100" step="1" value="0"></div></div><div class="visual"><svg id="scene" role="img" aria-label="同樣加熱，升溫為何不同？的互動示意"></svg><div class="readout" id="result"></div></div><div class="controls"><button type="button" id="play" class="primary">播放</button><button type="button" id="reset">重設</button><span role="status" aria-live="polite" id="status">可調整條件觀察</span></div><div class="question"><b>先想一想：</b>200 g 水的比熱會是 100 g 水的兩倍嗎？<details><summary>查看解釋</summary><p>同種物質比熱相同，質量增加會增加整體熱容量。固定加熱功率時，升溫速率由功率÷（質量×比熱）決定。熱平衡時能量由高溫物體傳向低溫物體，最後溫度由熱容量加權決定。</p></details></div><p class="note">加熱模式：各熱源 10 cal/s，初溫 20°C，忽略容器及散熱、不發生相變。甘油比熱取 0.58 cal/(g·°C)。熱平衡模式：A 水 80°C，B 水 100 g、20°C，隔離環境；指數曲線只作接近平衡的時間示意。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),svg=$('scene'),NS='http://www.w3.org/2000/svg';let W=800,H=390,frame=null,last=null,running=false;const C={blue:'#087fa4',red:'#d52b47',gold:'#a66a0a',green:'#258151',gray:'#92a8b7'};
function n(tag,attrs={},text=''){const node=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(text!==undefined)node.textContent=text;svg.append(node);return node}
function clear(){W=Math.max(260,svg.clientWidth);H=Math.max(360,svg.getBoundingClientRect().height||390);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.replaceChildren()}
function line(x1,y1,x2,y2,color=C.blue,dash=false,width=2){return n('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,...(dash?{'stroke-dasharray':'5 5'}:{})})}
function text(x,y,t,anchor='middle',color){return n('text',{x,y,'text-anchor':anchor,...(color?{style:'fill:'+color}:{})},t)}
function circle(x,y,r,color,fill=color){return n('circle',{cx:x,cy:y,r,stroke:color,fill,'stroke-width':2})}
function rect(x,y,w,h,fill,stroke='none'){return n('rect',{x,y,width:Math.max(0,w),height:Math.max(0,h),rx:4,fill,stroke})}
function path(points,color=C.blue,dash=false,width=2,opacity=1){return n('path',{d:points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '),fill:'none',stroke:color,'stroke-width':width,'stroke-opacity':opacity,...(dash?{'stroke-dasharray':'5 5'}:{})})}
function arrow(x1,y1,x2,y2,color=C.blue,dash=false){line(x1,y1,x2,y2,color,dash);const a=Math.atan2(y2-y1,x2-x1),l=8;return path([[x2-l*Math.cos(a-.45),y2-l*Math.sin(a-.45)],[x2,y2],[x2-l*Math.cos(a+.45),y2-l*Math.sin(a+.45)]],color)}
function val(id){return Number($(id).value)}function out(id,v){$(id).textContent=v}function bind(ids,fn){ids.forEach(id=>$(id).addEventListener('input',()=>{stop();fn();draw()}))}
function stop(msg='已暫停'){running=false;last=null;if($('play'))$('play').textContent='播放';out('status',msg)}
function playback(update){$('play').addEventListener('click',()=>{if(running){stop();return}running=true;last=null;$('play').textContent='暫停';out('status','播放中')});function tick(t){if(running){if(last!==null)update(Math.min(.1,(t-last)/1000));last=t;draw()}frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop('頁面隱藏，已暫停')});

let p=0;function chart(series,maxY,xlabel){const l=52,r=W-22,top=58,b=H-68;line(l,top,l,b,C.gray);line(l,b,r,b,C.gray);[20,40,60,80].forEach(v=>{const y=b-(v-20)/(maxY-20)*(b-top);line(l,y,r,y,C.gray,true);text(l-8,y+5,v,'end')});text(l,30,'溫度 °C','start');text(W/2,H-18,xlabel);series.forEach(s=>{const pts=[];for(let i=0;i<=100;i++){const u=i/100;pts.push([l+(r-l)*u,b-(s.fn(u)-20)/(maxY-20)*(b-top)])}path(pts,s.color,true,2,.22)});series.forEach(s=>{const pts=[];for(let i=0;i<=100;i++){const u=p*i/100;pts.push([l+(r-l)*u,b-(s.fn(u)-20)/(maxY-20)*(b-top)])}if(pts.length>1)path(pts,s.color,false,3,1);circle(pts.at(-1)[0],pts.at(-1)[1],5,s.color)});const px=l+(r-l)*p;line(px,top,px,b,C.gold,false,2);[0,.5,1].forEach(u=>text(l+(r-l)*u,b+26,Math.round(u*100)+'%'))}
function draw(){clear();const m=val('mass');out('mass-out',m+' g');out('progress-out',Math.round(p*100)+'%');$('progress').value=p*100;if($('mode').value==='heating'){const series=[{color:C.blue,fn:u=>20+3000*u/m},{color:C.red,fn:u=>20+3000*u/200},{color:C.gold,fn:u=>20+3000*u/(100*.58)}];chart(series,80,'加熱進度（100%＝300 秒）');out('result',`藍：A 水 ${m}g，${series[0].fn(p).toFixed(1)}°C ｜ 紅：水 200g，${series[1].fn(p).toFixed(1)}°C ｜ 金：甘油 100g，${series[2].fn(p).toFixed(1)}°C ｜ 每杯吸熱 ${(3000*p).toFixed(0)} cal`)}else{const eq=(m*80+100*20)/(m+100),decay=u=>Math.exp(-6*u),a=u=>eq+(80-eq)*decay(u),b=u=>eq+(20-eq)*decay(u);chart([{color:C.red,fn:a},{color:C.blue,fn:b}],80,'熱平衡接近過程（示意進度）');out('result',`紅：A 熱水 ${a(p).toFixed(1)}°C ｜ 藍：B 冷水 ${b(p).toFixed(1)}°C ｜ 最終趨近 ${eq.toFixed(1)}°C ｜ A 放熱＝B 吸熱 ${(m*(80-a(p))).toFixed(0)} cal`)}}
bind(['mode','mass'],()=>{p=0});bind(['progress'],()=>{p=val('progress')/100});$('reset').addEventListener('click',()=>{p=0;stop('已重設');draw()});$('play').addEventListener('click',()=>{if(p>=1)p=0});playback(dt=>{p=Math.min(1,p+dt/10);if(p>=1)stop('本次觀察完成')});

const initialMode=new URLSearchParams(location.search).get('mode');if(initialMode&&Array.from($('mode').options).some(o=>o.value===initialMode))$('mode').value=initialMode;
new ResizeObserver(draw).observe(svg);draw();let sent=0;new ResizeObserver(()=>{const height=Math.ceil(document.querySelector('main').getBoundingClientRect().height);if(height!==sent&&window.parent!==window){sent=height;window.parent.postMessage({type:'physics-animation:resize',height},location.origin==='null'?'*':location.origin)}}).observe(document.body);
})();</script></body></html>
