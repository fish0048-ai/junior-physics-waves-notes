<style>
  :root {
    --bg: #eef4f2;
    --ink: #12332e;
    --muted: #5b746f;
    --line: #c9ddd8;
    --card: #ffffff;
    --teal: #0f766e;
    --teal-2: #0d9488;
    --good: #047857;
    --good-bg: #d1fae5;
    --bad: #b91c1c;
    --bad-bg: #fee2e2;
    --warn: #b45309;
    --shadow: 0 10px 30px rgba(15, 118, 110, 0.12);
    --seat: 92px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  body {
    padding-bottom: env(safe-area-inset-bottom);
    user-select: none;
  }

  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: end;
    padding: 10px 12px calc(10px + env(safe-area-inset-top));
    background: rgba(238, 244, 242, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { min-width: 140px; margin-right: auto; }
  .brand strong { display: block; font-size: 18px; }
  .sync { font-size: 12px; color: var(--muted); }
  .sync.ok { color: var(--good); }
  .sync.busy { color: var(--warn); }
  .sync.err { color: var(--bad); }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .field.slim input { width: 56px; }
  select, input[type="number"], input[type="password"] {
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 10px;
    font-size: 16px;
    background: #fff;
    color: var(--ink);
  }
  .btn {
    height: 40px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 10px;
    padding: 0 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn.good { background: var(--good-bg); border-color: #6ee7b7; color: var(--good); }
  .btn.bad { background: var(--bad-bg); border-color: #fca5a5; color: var(--bad); }
  .btn.icon {
    width: 40px;
    padding: 0;
    font-size: 24px;
    line-height: 1;
  }
  .btn:disabled { opacity: 0.45; }

  main { padding: 12px 14px 28px; }
  .stage-label {
    text-align: center;
    background: linear-gradient(#134e4a, #0f766e);
    color: #fff;
    border-radius: 14px;
    padding: 10px;
    font-weight: 800;
    letter-spacing: 0.6em;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }

  .grid {
    display: grid;
    gap: 8px;
    align-items: stretch;
  }
  .cell, .seat, .ghost {
    touch-action: none;
  }
  .cell {
    min-height: var(--seat);
    border: 1px dashed #b7cdc8;
    border-radius: 14px;
    background: rgba(255,255,255,0.45);
    position: relative;
  }
  .cell.over { background: #ccfbf1; border-style: solid; border-color: var(--teal-2); }
  .aisle { pointer-events: none; }

  .seat {
    position: absolute;
    inset: 3px;
    border-radius: 12px;
    background: var(--card);
    box-shadow: 0 2px 8px rgba(18, 51, 46, 0.08);
    border: 2px solid #d7e8e4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px;
    cursor: grab;
  }
  .seat:active { cursor: grabbing; }
  .seat.picked { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.35); }
  .seat.win { border-color: #dc2626; transform: scale(1.04); }
  .no { font-size: 11px; color: var(--muted); font-weight: 700; }
  .name { font-size: 16px; font-weight: 800; line-height: 1.15; text-align: center; }
  .pts {
    margin-top: 3px;
    font-size: 12px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 999px;
    background: #f1f5f4;
    color: var(--muted);
  }
  .pts.up { background: var(--good-bg); color: var(--good); }
  .pts.down { background: var(--bad-bg); color: var(--bad); }

  .tray-wrap { margin-top: 16px; }
  .tray-wrap h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); }
  .tray {
    min-height: 88px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid var(--line);
  }
  .tray .seat { position: relative; inset: auto; width: 92px; height: 84px; }
  .tray.over { outline: 3px solid var(--teal-2); }

  .ghost {
    position: fixed;
    z-index: 80;
    pointer-events: none;
    width: 96px;
    height: 88px;
    opacity: 0.92;
    transform: scale(1.05);
  }
  .seat.dragging { opacity: 0.35; }

  .sheet {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 20, 0.35);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 40;
  }
  .sheet-card {
    width: min(520px, 100%);
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow);
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sheet-name { font-size: 22px; font-weight: 800; }
  .sheet-meta { color: var(--muted); margin-top: 2px; }
  .sheet-score { font-size: 42px; font-weight: 800; text-align: center; margin: 8px 0 12px; }
  .score-grid, .draw-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .score-grid .btn { height: 52px; font-size: 20px; }
  .draw-actions { grid-template-columns: 1fr 1fr; margin-top: 12px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px; }
  .hint { color: var(--muted); font-size: 13px; }

  .winner {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 20, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .winner-card {
    background: #fff;
    border-radius: 24px;
    padding: 28px 24px;
    text-align: center;
    min-width: min(340px, 92vw);
    box-shadow: var(--shadow);
    animation: pop 0.35s ease;
  }
  .winner-kicker { color: var(--teal); font-weight: 800; letter-spacing: 0.3em; }
  .winner-no { margin-top: 8px; color: var(--muted); font-size: 18px; }
  .winner-name { font-size: 42px; font-weight: 900; margin: 8px 0 18px; }
  @keyframes pop {
    from { transform: scale(0.86); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: #12332e;
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    z-index: 60;
    font-weight: 700;
  }

  .gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .gate-card {
    width: min(380px, 100%);
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .gate-card h1 { margin: 0 0 8px; }
  .gate-card p { color: var(--muted); }
  .gate-card input, .gate-card .btn { width: 100%; margin-top: 10px; }
  .error { color: var(--bad); }
  .hidden { display: none !important; }

  @media (max-width: 820px) {
    :root { --seat: 74px; }
    .name { font-size: 14px; }
    .top .btn { flex: 1 0 auto; }
  }
</style>
