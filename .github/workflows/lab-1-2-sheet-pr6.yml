name: lab-1-2-sheet-pr6

on:
  workflow_dispatch:
    inputs:
      content_ref:
        description: "PR head SHA 或 ref（lab-1-2-sheet.html／style.css 來源）"
        required: true
        default: "6c71b626d8949551f6c1496b1e1a0c8467217cfc"
  pull_request:
    paths:
      - "sections/lab-1-2-sheet.html"
      - "css/style.css"
      - "tests/lab-1-2-sheet-pr6.spec.ts"
      - ".github/workflows/lab-1-2-sheet-pr6.yml"

permissions:
  contents: read

jobs:
  pr6-lab-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tests branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Overlay PR content (lab sheet + CSS)
        env:
          CONTENT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.content_ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch origin "$CONTENT_REF"
          git checkout "$CONTENT_REF" -- sections/lab-1-2-sheet.html css/style.css

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: PR #6 專項（PDF／KaTeX／RWD）
        run: npx playwright test tests/lab-1-2-sheet-pr6.spec.ts

      - name: 既有 a11y 回歸
        run: npx playwright test tests/a11y-phase1.spec.ts tests/a11y-viewports.spec.ts tests/a11y-ink.spec.ts tests/a11y-sw.spec.ts tests/a11y-book.spec.ts

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pr6-lab-sheet-evidence
          path: |
            test-results/**/pr6-lab-sheet/**
            test-results/**/*.png
            playwright-report/
          retention-days: 14
